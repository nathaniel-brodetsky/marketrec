[package]
name = "marketrec"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Market-data recorder for Binance Spot with order book sync and gap detection"
license = "MIT"
repository = "https://github.com/nathaniel-brodetsky/marketrec"
publish = false

[dependencies]
arrow-array = "60"
arrow-schema = "60"
arrow-select = "60"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
zstd = "0.14"

[profile.release]
debug = 1

[dev-dependencies]
proptest = "1"
tempfile = "3"
