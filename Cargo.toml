[package]
name = "marketrec"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Market-data recorder for Binance Spot with order book sync and gap detection"
license = "MIT"
repository = "https://github.com/nathaniel-brodetsky/marketrec"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }

[profile.release]
debug = 1

[dev-dependencies]
proptest = "1"
tempfile = "3"
