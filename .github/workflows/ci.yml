name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tables are readable by another implementation
        run: |
          pip install --quiet pyarrow==20.0.0
          cargo run --quiet -- convert --input tests/fixtures/reconnect.jsonl --out "$RUNNER_TEMP/tables"
          python3 scripts/check_tables.py "$RUNNER_TEMP/tables/binance/BTCUSDT"
